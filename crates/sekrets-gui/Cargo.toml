[package]
name = "sekrets-gui"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Syed Ishtiaque Ahmad <ishtiaque05@gmail.com>"]
description = "Desktop GUI for sekrets"

[[bin]]
name = "sekrets-gui"
path = "src/main.rs"

[dependencies]
# "tokio" enables iced_futures's native async executor backend. Without it, iced_futures
# falls back to its "null" backend (see iced_futures::backend::null), which (a) has no
# `time::every` function at all — `iced::time::every`, which this task's subscription
# needs, would fail to compile — and (b) silently drops every `Task`/async future instead
# of spawning it, so no `Task::perform`-driven async work (unlock, create, migrate, etc.)
# would ever complete. Discovered while implementing Task H1; not present before.
iced = { version = "0.13.1", features = ["tokio"] }
sekrets-core = { path = "../sekrets-core" }

[dev-dependencies]
sekrets-core = { path = "../sekrets-core", features = ["test-utils"] }
# `iced_runtime::task::into_stream` is the only way to get at a `Task`'s underlying
# stream; it is public in `iced_runtime` but not re-exported through `iced`. Together with
# `futures`'s blocking executor it lets tests drive a real `Task` to completion and assert
# on the messages/actions it produces — the coverage gap that let the null-executor bug
# (every `Task::perform` future silently dropped) hide for five phases.
iced_runtime = "0.13.2"
futures = "0.3"

[package.metadata.deb]
maintainer = "Syed Ishtiaque Ahmad <ishtiaque05@gmail.com>"
depends = "libc6 (>= 2.28)"
priority = "optional"
section = "utils"
assets = [
    ["target/release/sekrets-gui", "/usr/local/bin/", "755"]
]
maintainer-scripts = "../../debian-gui/"

[package.metadata.bundle]
name = "Sekrets"
identifier = "com.ishtiaque05.sekrets-gui"
icon = []
version = "0.1.0"
copyright = "Copyright (c) Syed Ishtiaque Ahmad"
category = "public.app-category.utilities"
short_description = "Desktop GUI for the sekrets secret manager"
