[package]
name = "sekrets-cli"
version = "0.3.1"
edition = "2021"
license = "MIT"
authors = ["Syed Ishtiaque Ahmad <ishtiaque05@gmail.com>"]
description = "A secret management CLI tool"
repository = "https://github.com/ishtiaque05/sekrets"
homepage = "https://github.com/ishtiaque05/sekrets"
readme = "../../README.md"
categories = ["command-line-utilities"]
keywords = ["cli", "security", "secrets"]

[[bin]]
name = "sekrets"
path = "src/main.rs"

[package.metadata.deb]
# Keep the pre-workspace package name so a 0.2.x `sekrets` install upgrades in place
# instead of conflicting with a new `sekrets-cli` package over /usr/local/bin/sekrets.
name = "sekrets"
maintainer = "Syed Ishtiaque Ahmad <ishtiaque05@gmail.com>"
depends = "libc6 (>= 2.28)"
priority = "optional"
section = "utils"
assets = [
    ["target/release/sekrets", "/usr/local/bin/", "755"]
]
maintainer-scripts = "../../debian/"

[dependencies]
clap = { version = "4.5.30", features = ["derive"] }
anyhow = "1.0.82"
rpassword = "7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
flate2 = "1.0"
tar = "0.4"
tempfile = "3.5"
sekrets-core = { path = "../sekrets-core" }

[dev-dependencies]
googletest = "0.13"
assert_cmd = "2.0"
tempfile = "3.5"
predicates = "2.1"
temp-env = "0.2"
sekrets-core = { path = "../sekrets-core", features = ["test-utils"] }
